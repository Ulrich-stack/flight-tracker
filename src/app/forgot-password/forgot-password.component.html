<div class="simple-page">
  <div class="simple-card">
    <img src="assets/CLOUDtrack.png" alt="CLOUDtrack" class="brand-mark" />
    <div>
      <h1>Mot de passe oublié</h1>
      <p>Saisissez votre email : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
    </div>

    <form (ngSubmit)="forgotPassword()">
      <div class="field">
        <label for="emailInput">Email</label>
        <input
          type="email"
          id="emailInput"
          class="input"
          name="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
          [(ngModel)]="email"
        />
      </div>
      <button type="submit" class="btn btn-primary">Envoyer le lien</button>
    </form>

    <a routerLink="/login" class="back-link">← Retour à la connexion</a>
  </div>
</div>
