<app-map-backdrop></app-map-backdrop>

<div class="auth">
  <div class="auth-card">
    <a routerLink="/login" class="auth-brand">
      <img src="assets/CLOUDtrack.png" alt="" />
      <span>CLOUDtrack</span>
    </a>

    <h1>Mot de passe oublié</h1>
    <p class="auth-lede">Saisissez votre email : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>

    <form (ngSubmit)="forgotPassword()">
      <div class="field">
        <label for="emailInput">Email</label>
        <input
          type="email"
          id="emailInput"
          class="input"
          name="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
          [(ngModel)]="email"
        />
      </div>
      <button type="submit" class="btn btn-primary">Envoyer le lien</button>
    </form>

    <p class="auth-switch"><a routerLink="/login">← Retour à la connexion</a></p>
  </div>

  <p class="auth-foot">Positions en direct · données OpenSky Network</p>
</div>
