<app-map-backdrop></app-map-backdrop>

<div class="auth">
  <div class="auth-card">
    <a routerLink="/login" class="auth-brand">
      <img src="assets/CLOUDtrack.png" alt="" />
      <span>CLOUDtrack</span>
    </a>

    <h1>Connexion</h1>
    <p class="auth-lede">Retrouvez vos vols suivis et vos aéroports favoris.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          class="input"
          type="email"
          id="email"
          formControlName="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
        />
        <span
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
          Saisissez une adresse email valide.
        </span>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="password">Mot de passe</label>
          <a routerLink="/forgot-password">Mot de passe oublié ?</a>
        </div>
        <input
          class="input"
          type="password"
          id="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
        Se connecter
      </button>
    </form>

    <p class="auth-switch">Pas encore de compte ? <a routerLink="/signin">Créer un compte</a></p>
  </div>

  <p class="auth-foot">Positions en direct · données OpenSky Network</p>
</div>
