<app-map-backdrop></app-map-backdrop>

<div class="auth">
  <a routerLink="/login" class="auth-brand">
    <img src="assets/CLOUDtrack.png" alt="" />
    <span>CLOUDtrack</span>
  </a>

  <div class="auth-body">
    <h1>Créer un compte</h1>
    <p class="auth-lede">
      Vous avez déjà un compte ? <a routerLink="/login">Connectez-vous</a>
    </p>

    <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="prenom">Prénom</label>
          <input class="input" type="text" id="prenom" formControlName="prenom" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="name">Nom</label>
          <input class="input" type="text" id="name" formControlName="name" autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          class="input"
          type="email"
          id="email"
          formControlName="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
        />
        <span
          class="field-error"
          *ngIf="signinForm.get('email')?.touched && signinForm.get('email')?.invalid"
        >
          Saisissez une adresse email valide.
        </span>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          class="input"
          type="password"
          id="password"
          formControlName="password"
          autocomplete="new-password"
        />
        <span
          [class.field-error]="signinForm.get('password')?.touched && signinForm.get('password')?.invalid"
          [class.field-hint]="!(signinForm.get('password')?.touched && signinForm.get('password')?.invalid)"
        >
          6 caractères minimum.
        </span>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="signinForm.invalid">
        Créer le compte
      </button>
    </form>
  </div>

  <p class="auth-foot">Positions en direct · données OpenSky Network</p>
</div>
