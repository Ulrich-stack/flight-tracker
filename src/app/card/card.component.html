<td class="col-flight">
  <span class="code">{{ flight.flight.iata }}</span>
  <span class="muted">{{ flight.airline?.name }}</span>
</td>
<td class="col-from">
  <span class="code">{{ flight.departure.iata }}</span>
  <span class="muted">{{ flight.departure.airport }}</span>
</td>
<td class="col-time col-dep num">{{ flight.departure.scheduled | date: 'HH:mm' : 'UTC' }}</td>
<td class="col-time num">{{ flight.arrival.scheduled | date: 'HH:mm' : 'UTC' }}</td>
<td class="col-status" [attr.data-status]="flight.flight_status">
  {{ statusLabel }}
  <span class="delay num" *ngIf="flight.departure.delay">+{{ flight.departure.delay }} min</span>
</td>
<td class="col-fav">
  <button
    type="button"
    class="fav"
    [class.is-active]="isFavorite"
    [attr.aria-pressed]="isFavorite"
    [attr.aria-label]="isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris'"
    (click)="toggleFavorite()"
  >
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path
        d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</td>
