<div class="menu" *ngIf="isOpen" role="menu">
  <a routerLink="/profil" role="menuitem" (click)="close()">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    Mon profil
  </a>
  <div class="divider"></div>
  <button type="button" role="menuitem" class="danger" (click)="onLogout()">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Se déconnecter
  </button>
</div>
